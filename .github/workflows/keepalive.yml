name: Keep-alive

# Supabase Free pauses projects after 7 days without activity (spec 007, AC5).
on:
  schedule:
    - cron: "17 12 * * 1" # Mondays 09:17 BRT
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: ping ${{ matrix.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: staging
            ref_secret: SUPABASE_PROJECT_REF_STAGING
            password_secret: SUPABASE_DB_PASSWORD_STAGING
          - env: production
            ref_secret: SUPABASE_PROJECT_REF_PROD
            password_secret: SUPABASE_DB_PASSWORD_PROD
    env:
      SUPABASE_POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Query the database
        env:
          PROJECT_REF: ${{ secrets[matrix.ref_secret] }}
          SUPABASE_DB_PASSWORD: ${{ secrets[matrix.password_secret] }}
        run: ./scripts/ci/supabase-db.sh ping
      - name: Production health check
        if: matrix.env == 'production'
        run: curl -fsS --retry 3 --retry-delay 10 --retry-all-errors "${{ vars.PRODUCTION_URL }}/api/health"
